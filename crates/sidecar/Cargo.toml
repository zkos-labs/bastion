[package]
name = "bastion-sidecar"
version = "0.3.0"
edition = "2024"
description = "Bastion off-chain policy evaluator sidecar - HTTP server wrapping the Bastion policy engine"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
base64 = "0.22"
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.8"
sled = "0.34"
uuid = { version = "1.20.0", features = ["v4"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
sha2 = "0.10"
bastion-core = { path = "../core" }
bastion-policy-engine = { path = "../policy-engine" }
bastion-workflow = { path = "../workflow" }
bastion-web2-firewall = { path = "../web2-firewall" }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bs58 = "0.5.1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
