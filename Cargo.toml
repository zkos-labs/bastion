[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/policy-engine",
    "crates/workflow",
    "crates/sidecar",
    "crates/web2-firewall",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/zkos-labs/bastion"

[workspace.dependencies]
bastion-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
uuid = { version = "1", features = ["v4"] }

# Optimize build times for local development
[profile.dev]
opt-level = 0

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Keep arithmetic overflow checks on in release/SBF builds. The on-chain program
# is deployed from a release build; silent wraparound must never mint counters or
# reputation. The cost is negligible for this workload.
overflow-checks = true
