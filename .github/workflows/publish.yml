name: Publish npm packages

on:
  push:
    tags:
      - '@zkos-labs/*@*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm Trusted Publishing (OIDC) + provenance

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tag is "<package-name>@<version>" (e.g. "@zkos-labs/bastion-agentique@1.1.0").
      # Derive the package to publish from the tag itself, rather than a
      # static matrix -- otherwise pushing one package's tag also fans out
      # to publish every other package in the workspace on every tag push.
      - name: Resolve package from tag
        id: pkg
        run: |
          tag="${{ github.ref_name }}"
          pkg_name="${tag%@*}"
          version="${tag##*@}"
          echo "name=$pkg_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          dir=$(pnpm -r exec node -e "if (require('./package.json').name === '${{ steps.pkg.outputs.name }}') console.log(process.cwd())" | head -1)
          if [ -z "$dir" ]; then
            echo "::error::No workspace package named ${{ steps.pkg.outputs.name }}"
            exit 1
          fi
          actual=$(node -e "console.log(require('$dir/package.json').version)")
          if [ "$actual" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "::error::Tag version ${{ steps.pkg.outputs.version }} does not match package.json version $actual"
            exit 1
          fi

      - name: Build
        run: pnpm --filter "${{ steps.pkg.outputs.name }}" build

      # No NODE_AUTH_TOKEN / long-lived npm token here on purpose. This relies
      # entirely on npm's Trusted Publishing (OIDC) -- pnpm exchanges the
      # `id-token: write` OIDC token above for a short-lived npm publish
      # token automatically when the package has a Trusted Publisher
      # configured on npmjs.com pointing at this exact repo + workflow file
      # (Settings -> Trusted Publisher, on each package's npmjs.com page).
      # That configuration is a one-time, per-package, npm-account-side step
      # this workflow can't do on its own.
      - name: Publish
        run: pnpm --filter "${{ steps.pkg.outputs.name }}" publish --no-git-checks --provenance
