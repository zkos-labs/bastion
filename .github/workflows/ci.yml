name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5

jobs:
  # ── Rust crates ──────────────────────────────────────────────
  core:
    name: core (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/core"
      - run: cargo check -p bastion-core
      - run: cargo clippy -p bastion-core -- -D warnings
      - run: cargo test -p bastion-core

  sidecar:
    name: sidecar (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/sidecar"
      - run: cargo check -p bastion-sidecar
      - run: cargo clippy -p bastion-sidecar -- -D warnings
      - run: cargo test -p bastion-sidecar

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    name: audit (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── EVM contracts ───────────────────────────────────────────
  evm:
    name: evm (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0
      - run: forge build
      - run: forge test -vvv
      - run: forge snapshot --check

  # ── Dashboard ───────────────────────────────────────────────
  web:
    name: web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bastion-dashboard build

  # ── SDK ─────────────────────────────────────────────────────
  sdk:
    name: sdk (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zkos-labs/bastion-agentique build
      - run: pnpm --filter @zkos-labs/bastion-agentique test

  # ── Web2 SDK ────────────────────────────────────────────────
  web2-sdk:
    name: web2-sdk (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zkos-labs/bastion-web2 build

  # ── MCP Server ──────────────────────────────────────────────
  mcp-server:
    name: mcp-server (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zkos-labs/mcp-server build

  # ── Web2 firewall crate ─────────────────────────────────────
  web2-crate:
    name: web2-firewall (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/web2-firewall"
      - run: cargo check -p bastion-web2-firewall
      - run: cargo clippy -p bastion-web2-firewall -- -D warnings
      - run: cargo test -p bastion-web2-firewall

  policy-engine:
    name: policy-engine (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/policy-engine"
      - run: cargo check -p bastion-policy-engine
      - run: cargo clippy -p bastion-policy-engine -- -D warnings
      - run: cargo test -p bastion-policy-engine
